<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sitesync-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8323E" />
      <stop offset="100%" stop-color="#7B1E28" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#211715" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#sitesync-bg)" stroke="#211715" stroke-width="24" filter="url(#shadow)" />

  <!-- Hard Hat / Structure Modern Fusion Icon -->
  <!-- Top Hat Dome -->
  <path d="M160 270 C160 160, 352 160, 352 270 Z" fill="#F7F0E5" stroke="#211715" stroke-width="16" stroke-linejoin="round" />

  <!-- Central Crown Ridge -->
  <path d="M236 172 C236 150, 276 150, 276 172 L276 270 L236 270 Z" fill="#E9DCCB" stroke="#211715" stroke-width="12" />

  <!-- Hat Brim -->
  <path d="M120 270 C120 258, 136 254, 150 254 L362 254 C376 254, 392 258, 392 270 C392 284, 376 294, 356 294 L156 294 C136 294, 120 284, 120 270 Z" fill="#F7F0E5" stroke="#211715" stroke-width="16" stroke-linejoin="round" />

  <!-- Sync Wave / Foundation Bars Below -->
  <rect x="160" y="324" width="76" height="24" rx="12" fill="#E9DCCB" stroke="#211715" stroke-width="10" />
  <rect x="256" y="324" width="96" height="24" rx="12" fill="#F7F0E5" stroke="#211715" stroke-width="10" />
  <rect x="180" y="366" width="152" height="24" rx="12" fill="#E9DCCB" stroke="#211715" stroke-width="10" />

  <!-- Subtle Accent Light Dot -->
  <circle cx="256" cy="195" r="14" fill="#A8323E" />
</svg>
