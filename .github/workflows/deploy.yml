name: SiteSync CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'ai/**'
      - 'deploy.sh'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  test:
    name: Syntax & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Syntax Check
        run: |
          flake8 backend ai --count --select=E9,F63,F7,F82 --show-source --statistics

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Detect project directory and run deploy.sh
            if [ -f "$HOME/SiteSync/deploy.sh" ]; then
              bash "$HOME/SiteSync/deploy.sh"
            elif [ -f "$HOME/Sitesync/deploy.sh" ]; then
              bash "$HOME/Sitesync/deploy.sh"
            elif [ -f "/home/ubuntu/SiteSync/deploy.sh" ]; then
              bash "/home/ubuntu/SiteSync/deploy.sh"
            else
              echo "Error: deploy.sh not found on EC2!"
              exit 1
            fi
